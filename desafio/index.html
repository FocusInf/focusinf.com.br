<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Desafio Bíblico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            color: #111827;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #1e3a8a;
        }

        .tela {
            display: none;
        }

        .tela.ativa {
            display: block;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #1e3a8a;
            color: white;
        }

        button:hover {
            opacity: .9;
        }

        .pergunta {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 25px 0;
        }

        .pontos {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #b45309;
        }

        .cronometro {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin: 20px;
            color: #dc2626;
        }

        .alternativa {
            background: #f3f4f6;
            color: #111827;
            margin: 10px 0;
            border: 2px solid #ddd;
        }

        .alternativa:hover {
            background: #dbeafe;
        }

        .mensagem {
            text-align: center;
            font-size: 20px;
            margin-top: 20px;
        }

        .versiculo {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📖 Desafio Bíblico</h1>

    <!-- CADASTRO -->
    <div id="telaCadastro" class="tela ativa">

        <h2>Digite seu nome</h2>

        <input
            type="text"
            id="nome"
            placeholder="Seu nome"
            maxlength="100"
        >

        <button onclick="entrar()">
            🎮 Entrar no jogo
        </button>

        <div id="mensagemCadastro" class="mensagem"></div>

    </div>

    <!-- AGUARDANDO -->
    <div id="telaAguardando" class="tela">

        <h2>⏳ Aguardando o administrador...</h2>

        <p class="mensagem">
            Você está inscrito no Desafio Bíblico.
        </p>

        <p class="mensagem">
            Aguarde o administrador iniciar a partida.
        </p>

    </div>

    <!-- PERGUNTA -->
    <div id="telaPergunta" class="tela">

        <div class="pontos" id="valorPontos">
            💰 10 pontos
        </div>

        <div class="cronometro" id="cronometro">
            60
        </div>

        <div class="pergunta" id="textoPergunta">
        </div>

        <button class="alternativa" onclick="responder('A')" id="btnA"></button>
        <button class="alternativa" onclick="responder('B')" id="btnB"></button>
        <button class="alternativa" onclick="responder('C')" id="btnC"></button>
        <button class="alternativa" onclick="responder('D')" id="btnD"></button>

        <div id="mensagemResposta" class="mensagem"></div>

    </div>

    <!-- FINAL -->
    <div id="telaFinal" class="tela">

        <h2>🏆 Partida encerrada!</h2>

        <p class="mensagem">
            Obrigado por participar do Desafio Bíblico!
        </p>

        <p class="mensagem">
            Aguarde o resultado.
        </p>

    </div>

</div>

<script>

let jogadorId = null;
let perguntaAtual = null;
let respondida = false;
let intervalo = null;
let tempoRestante = 60;


/* TROCAR TELA */

function mostrarTela(id) {

    document.querySelectorAll(".tela").forEach(tela => {
        tela.classList.remove("ativa");
    });

    document.getElementById(id).classList.add("ativa");
}


/* ENTRAR NO JOGO */

async function entrar() {

    const nome = document.getElementById("nome").value.trim();

    if (!nome) {
        document.getElementById("mensagemCadastro").innerText =
            "Digite seu nome.";
        return;
    }

    try {

        const resposta = await fetch("/api/jogadores", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                nome: nome
            })

        });

        const dados = await resposta.json();

        if (!dados.sucesso) {

            document.getElementById("mensagemCadastro").innerText =
                dados.erro || "Erro ao entrar.";

            return;
        }

        jogadorId = dados.jogador.id;

        mostrarTela("telaAguardando");

        verificarJogo();

    } catch (erro) {

        document.getElementById("mensagemCadastro").innerText =
            "Erro de conexão com o servidor.";

        console.error(erro);
    }
}


/* VERIFICAR STATUS DO JOGO */

async function verificarJogo() {

    if (!jogadorId) return;

    try {

        const resposta = await fetch("/api/jogo");

        const dados = await resposta.json();

        if (!dados.sucesso) return;

        if (dados.jogo.encerrado) {

            mostrarTela("telaFinal");
            return;
        }

        if (dados.jogo.pergunta_ativa) {

            carregarPergunta(dados.jogo);

        } else {

            mostrarTela("telaAguardando");
        }

    } catch (erro) {

        console.error(erro);
    }

    setTimeout(verificarJogo, 2000);
}


/* CARREGAR PERGUNTA */

function carregarPergunta(jogo) {

    if (
        perguntaAtual &&
        perguntaAtual.id === jogo.pergunta.id
    ) {
        return;
    }

    perguntaAtual = jogo.pergunta;
    respondida = false;

    document.getElementById("textoPergunta").innerText =
        perguntaAtual.pergunta;

    document.getElementById("btnA").innerText =
        "A) " + perguntaAtual.alternativa_a;

    document.getElementById("btnB").innerText =
        "B) " + perguntaAtual.alternativa_b;

    document.getElementById("btnC").innerText =
        "C) " + perguntaAtual.alternativa_c;

    document.getElementById("btnD").innerText =
        "D) " + perguntaAtual.alternativa_d;

    document.getElementById("valorPontos").innerText =
        "💰 " + perguntaAtual.pontos + " pontos";

    document.getElementById("mensagemResposta").innerText = "";

    ativarBotoes();

    mostrarTela("telaPergunta");

    iniciarCronometro();

}


/* CRONÔMETRO */

function iniciarCronometro() {

    clearInterval(intervalo);

    tempoRestante = 60;

    document.getElementById("cronometro").innerText =
        tempoRestante;

    intervalo = setInterval(() => {

        tempoRestante--;

        document.getElementById("cronometro").innerText =
            tempoRestante;

        if (tempoRestante <= 0) {

            clearInterval(intervalo);

            bloquearBotoes();

            document.getElementById("mensagemResposta").innerText =
                "⏰ Tempo encerrado!";

        }

    }, 1000);

}


/* RESPONDER */

async function responder(alternativa) {

    if (respondida) return;

    if (tempoRestante <= 0) return;

    respondida = true;

    bloquearBotoes();

    clearInterval(intervalo);

    try {

        const resposta = await fetch("/api/responder", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                jogador_id: jogadorId,

                pergunta_id: perguntaAtual.id,

                resposta: alternativa

            })

        });

        const dados = await resposta.json();

        if (dados.sucesso) {

            if (dados.correta) {

                document.getElementById("mensagemResposta").innerText =
                    "✅ Resposta correta! +" + dados.pontos + " pontos";

            } else {

                document.getElementById("mensagemResposta").innerText =
                    "❌ Resposta incorreta.";

            }

        } else {

            document.getElementById("mensagemResposta").innerText =
                dados.erro || "Erro ao responder.";

        }

    } catch (erro) {

        console.error(erro);

        document.getElementById("mensagemResposta").innerText =
            "Erro de conexão.";
    }

}


/* BLOQUEAR BOTÕES */

function bloquearBotoes() {

    document.querySelectorAll(".alternativa").forEach(botao => {
        botao.disabled = true;
    });

}


/* LIBERAR BOTÕES */

function ativarBotoes() {

    document.querySelectorAll(".alternativa").forEach(botao => {
        botao.disabled = false;
    });

}


/* INICIAR VERIFICAÇÃO */

</script>

</body>
</html>
