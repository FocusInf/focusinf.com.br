<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desafio Bíblico</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #333;
        }

        #pergunta {
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0;
        }

        .alternativa {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: #e9e9e9;
        }

        .alternativa:hover {
            background: #d5d5d5;
        }

        #mensagem {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📖 Desafio Bíblico</h1>

    <div id="pergunta">
        Carregando pergunta...
    </div>

    <button class="alternativa" id="A"></button>
    <button class="alternativa" id="B"></button>
    <button class="alternativa" id="C"></button>
    <button class="alternativa" id="D"></button>

    <div id="mensagem"></div>

</div>

<script>

async function carregarPergunta() {

    try {

        const resposta = await fetch('/api/jogo');

        const dados = await resposta.json();

        if (!dados.sucesso || !dados.perguntas.length) {
            document.getElementById('pergunta').textContent =
                'Nenhuma pergunta encontrada.';
            return;
        }

        const pergunta = dados.perguntas[0];

        document.getElementById('pergunta').textContent =
            pergunta.pergunta;

        document.getElementById('A').textContent =
            'A) ' + pergunta.alternativa_a;

        document.getElementById('B').textContent =
            'B) ' + pergunta.alternativa_b;

        document.getElementById('C').textContent =
            'C) ' + pergunta.alternativa_c;

        document.getElementById('D').textContent =
            'D) ' + pergunta.alternativa_d;

    } catch (erro) {

        document.getElementById('pergunta').textContent =
            'Erro ao carregar a pergunta.';

        console.error(erro);
    }
}

carregarPergunta();

</script>

</body>
</html>
