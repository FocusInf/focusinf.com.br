
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>📖 Desafio Bíblico - Administrador</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e3a8a);
    color: #111827;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 40px #0006;
}

h1 {
    text-align: center;
    color: #1e3a8a;
}

.painel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    padding: 20px;
    border-radius: 15px;
    background: #f3f4f6;
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 0;
    border-radius: 10px;
    background: #1e3a8a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

button.encerrar {
    background: #b91c1c;
}

.pergunta {
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
}

.pontos {
    font-size: 22px;
    font-weight: bold;
    color: #b45309;
}

.timer {
    font-size: 45px;
    font-weight: bold;
    color: #dc2626;
    text-align: center;
}

.status {
    font-size: 18px;
    font-weight: bold;
    margin: 15px 0;
}

.respostas {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    margin: 12px 0;
    color: #1e3a8a;
}

.ranking p,
#jogadores p {
    padding: 10px;
    margin: 5px 0;
    background: white;
    border-radius: 8px;
}

#aviso {
    color: #b91c1c;
    font-weight: bold;
}

@media (max-width: 700px) {
    .painel {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>👨‍💼 Painel do Administrador</h1>

<div class="painel">

    <div class="card">
        <h2>🎮 Controle da partida</h2>

        <button id="btnIniciar" onclick="iniciar()">
            ▶️ Iniciar partida
        </button>

        <button id="btnProxima" onclick="proxima()">
            ➡️ Liberar próxima pergunta
        </button>

        <button id="btnFinalizar" onclick="finalizar()">
            🏆 Finalizar e mostrar ranking
        </button>

        <button id="btnEncerrar" class="encerrar"
                onclick="encerrar()">
            🛑 Encerrar e limpar jogadores
        </button>

        <div id="status" class="status">
            Carregando...
        </div>

        <div id="aviso" role="status"></div>
    </div>

    <div class="card">
        <h2>👥 Jogadores</h2>
        <div id="jogadores">Carregando...</div>
    </div>

</div>

<div class="card" style="margin-top:20px">
    <h2>📖 Pergunta atual</h2>

    <div id="pontos" class="pontos"></div>
    <div id="tempo" class="timer">--</div>

    <div id="respostas" class="respostas">
        0 / 0 jogadores responderam
    </div>

    <div id="texto" class="pergunta">
        Nenhuma pergunta liberada.
    </div>

    <div id="numero"></div>
</div>

<div class="card" style="margin-top:20px">
    <h2>🏆 Ranking</h2>
    <div id="ranking" class="ranking">
        Carregando...
    </div>
</div>

</div>

<script>
// =====================================================
// DESAFIO BÍBLICO - PAINEL ADMINISTRATIVO
// =====================================================

// Guarda o estado atual da partida.
let estadoAtual = null;

// Guarda a identificação da rodada.
let rodadaAtual = null;

// Controla o cronômetro local.
let intervaloTimer = null;
let fimLocal = 0;

// Impede comandos repetidos e consultas simultâneas.
let comandoEmAndamento = false;
let consultaEmAndamento = false;

// Guarda a pergunta para contar respostas.
let ultimaPerguntaId = null;

// =====================================================
// FUNÇÕES AUXILIARES
// =====================================================

// Encontra um elemento da página pelo ID.
function elemento(id) {
    return document.getElementById(id);
}

// Mostra mensagens de erro ou conexão.
function aviso(mensagem) {
    elemento("aviso").textContent = mensagem || "";
}

// Habilita ou desabilita os botões.
function controlarBotoes() {
    const j = estadoAtual;

    elemento("btnIniciar").disabled = comandoEmAndamento;

    elemento("btnProxima").disabled =
        comandoEmAndamento ||
        !j ||
        !j.iniciado ||
        j.encerrado ||
        j.pergunta_ativa;

    elemento("btnFinalizar").disabled =
        comandoEmAndamento ||
        !j ||
        j.encerrado;

    elemento("btnEncerrar").disabled =
        comandoEmAndamento;
}

// =====================================================
// ENVIAR COMANDO AO SERVIDOR COM SENHA DO ADMINISTRADOR
// =====================================================

// Mantém a senha apenas na memória da página atual.
// Ela não é gravada no localStorage nem no sessionStorage.
let senhaAdmin = "";

async function enviarComando(acao) {
    // Evita dois cliques simultâneos.
    if (comandoEmAndamento) return null;

    // Solicita a senha somente quando for executar um comando.
    if (!senhaAdmin) {
        const digitada = prompt("Digite a senha do administrador:");

        // Cancelar o pedido não executa nenhuma ação.
        if (digitada === null || digitada === "") return null;

        senhaAdmin = digitada;
    }

    comandoEmAndamento = true;
    controlarBotoes();
    aviso("");

    try {
        const resposta = await fetch("/api/jogo", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // O servidor verificará esta senha antes de executar a ação.
                "X-Admin-Password": senhaAdmin
            },
            cache: "no-store",
            body: JSON.stringify({ acao })
        });

        // Tenta ler a mensagem enviada pela API.
        const dados = await resposta.json();

        // Apaga a senha da memória se o servidor a rejeitar.
        if (resposta.status === 401 || resposta.status === 403) {
            senhaAdmin = "";
            throw new Error(dados.erro || "Senha incorreta. Tente novamente.");
        }

        if (!resposta.ok || !dados.sucesso) {
            throw new Error(
                dados.erro || "Não foi possível executar o comando."
            );
        }

        // Atualiza o painel depois de executar o comando.
        await atualizarTudo();

        return dados;

    } catch (erro) {
        console.error("Erro no comando:", erro);
        aviso(erro.message || "Erro de conexão.");
        return null;

    } finally {
        comandoEmAndamento = false;
        controlarBotoes();
    }
}

// =====================================================
// INICIAR PARTIDA
// =====================================================

async function iniciar() {
    // Iniciar zera as respostas e pontuações anteriores.
    if (!confirm(
        "Iniciar uma nova partida?\n\n" +
        "As respostas e pontuações anteriores serão zeradas."
    )) {
        return;
    }

    const dados = await enviarComando("iniciar");

    if (dados) {
        ultimaPerguntaId = null;
        rodadaAtual = null;
        pararTimer();
        aviso("");
    }
}

// =====================================================
// LIBERAR PRÓXIMA PERGUNTA
// =====================================================

async function proxima() {
    const dados = await enviarComando("proxima");

    if (dados && dados.finalizado) {
        alert("Não há mais perguntas disponíveis.");
    }
}

// =====================================================
// FINALIZAR E MOSTRAR RANKING
// =====================================================

// Este comando finaliza a partida e mantém o ranking.
// Não é apenas uma pausa entre perguntas.
async function finalizar() {
    if (!confirm(
        "Finalizar a partida e mostrar o ranking final?"
    )) {
        return;
    }

    await enviarComando("encerrar_pergunta");
}

// =====================================================
// ENCERRAR E LIMPAR JOGADORES
// =====================================================

// Atenção: esta ação remove jogadores e respostas.
// As perguntas cadastradas no Neon são preservadas.
async function encerrar() {
    if (!confirm(
        "ATENÇÃO!\n\n" +
        "Encerrar e apagar jogadores, respostas e pontuações?"
    )) {
        return;
    }

    const dados = await enviarComando("encerrar");

    if (dados) {
        ultimaPerguntaId = null;
        rodadaAtual = null;
        pararTimer();
    }
}

// =====================================================
// CRONÔMETRO
// =====================================================

// Para o cronômetro e libera sua referência.
// Isso permite iniciar outro cronômetro na nova rodada.
function pararTimer() {
    if (intervaloTimer !== null) {
        clearInterval(intervaloTimer);
        intervaloTimer = null;
    }
}

// Atualiza os segundos exibidos no painel.
function desenharTempo() {
    if (!estadoAtual || !estadoAtual.pergunta_ativa) {
        pararTimer();
        return;
    }

    const restante = Math.max(
        0,
        Math.ceil((fimLocal - Date.now()) / 1000)
    );

    elemento("tempo").textContent = String(restante);

    if (restante <= 0) {
        pararTimer();
        elemento("tempo").textContent = "ENCERRADA";
    }
}

// Inicia um cronômetro para a pergunta atual.
function iniciarTimer(jogo) {
    pararTimer();

    // Usa o tempo restante informado pelo servidor.
    // Assim, uma atualização da página não reinicia os 60s.
    const restante = Math.max(
        0,
        Number(jogo.tempo_restante || 0)
    );

    fimLocal = Date.now() + restante * 1000;

    desenharTempo();

    if (restante > 0) {
        intervaloTimer = setInterval(desenharTempo, 250);
    }
}

// =====================================================
// ATUALIZAR ESTADO DA PARTIDA
// =====================================================

async function atualizarJogo() {
    const resposta = await fetch(
        "/api/jogo?_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) {
        throw new Error("Falha ao consultar o jogo.");
    }

    const dados = await resposta.json();

    if (!dados.sucesso || !dados.jogo) {
        throw new Error(dados.erro || "Estado indisponível.");
    }

    const j = dados.jogo;
    estadoAtual = j;

    // Atualiza a situação da partida.
    elemento("status").textContent =
        j.encerrado
            ? "🏆 Partida finalizada"
            : j.pergunta_ativa
                ? "🟢 Pergunta ativa"
                : j.iniciado
                    ? "🟡 Aguardando próxima pergunta"
                    : "⚪ Partida parada";

    if (j.pergunta_id) {
        ultimaPerguntaId = j.pergunta_id;
    }

    if (j.pergunta_ativa && j.pergunta) {
        // Identifica a rodada pelo ID, número e horário.
        const chaveRodada = [
            j.pergunta.id,
            j.numero_pergunta,
            j.tempo_inicio
        ].join("|");

        elemento("texto").textContent =
            j.pergunta.pergunta;

        elemento("pontos").textContent =
            "💰 " + j.pergunta.pontos + " pontos";

        elemento("numero").textContent =
            "Pergunta nº " + j.numero_pergunta;

        // Só reinicia o cronômetro quando muda a rodada.
        if (
            chaveRodada !== rodadaAtual ||
            intervaloTimer === null
        ) {
            rodadaAtual = chaveRodada;
            iniciarTimer(j);
        }

    } else {
        // A pergunta terminou ou ainda não foi liberada.
        pararTimer();
        rodadaAtual = null;

        elemento("tempo").textContent =
            Number(j.numero_pergunta || 0) > 0
                ? "ENCERRADA"
                : "--";

        elemento("texto").textContent =
            "Nenhuma pergunta ativa.";

        elemento("pontos").textContent = "";
        elemento("numero").textContent = "";
    }

    controlarBotoes();
}

// =====================================================
// CONTAR RESPOSTAS
// =====================================================

async function atualizarRespostas() {
    if (!ultimaPerguntaId) {
        elemento("respostas").textContent =
            "0 / 0 jogadores responderam";
        return;
    }

    const resposta = await fetch(
        "/api/responder?pergunta_id=" +
        encodeURIComponent(ultimaPerguntaId) +
        "&_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) return;

    const dados = await resposta.json();

    if (!dados.sucesso) return;

    elemento("respostas").textContent =
        dados.totalRespostas +
        " / " +
        dados.totalJogadores +
        " jogadores responderam";
}

// =====================================================
// LISTAR JOGADORES
// =====================================================

async function atualizarJogadores() {
    const resposta = await fetch(
        "/api/jogadores?_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) return;

    const dados = await resposta.json();
    if (!dados.sucesso) return;

    const destino = elemento("jogadores");
    destino.replaceChildren();

    if (!dados.jogadores?.length) {
        destino.textContent = "Nenhum jogador.";
        return;
    }

    // textContent evita interpretar nomes como código HTML.
    for (const jogador of dados.jogadores) {
        const linha = document.createElement("p");

        linha.textContent =
            "👤 " + jogador.nome +
            " — 💰 " + jogador.pontuacao + " pontos";

        destino.appendChild(linha);
    }
}

// =====================================================
// ATUALIZAR RANKING
// =====================================================

async function atualizarRanking() {
    const resposta = await fetch(
        "/api/ranking?_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) return;

    const dados = await resposta.json();
    if (!dados.sucesso) return;

    const destino = elemento("ranking");
    destino.replaceChildren();

    if (!dados.ranking?.length) {
        destino.textContent = "Nenhum jogador.";
        return;
    }

    dados.ranking.forEach((jogador, indice) => {
        const linha = document.createElement("p");

        linha.textContent =
            (indice + 1) + "º " +
            jogador.nome +
            " — " +
            jogador.pontuacao + " pontos";

        destino.appendChild(linha);
    });
}

// =====================================================
// ATUALIZAÇÃO AUTOMÁTICA
// =====================================================

async function atualizarTudo() {
    // Evita consultas sobrepostas quando a internet está lenta.
    if (consultaEmAndamento) return;

    consultaEmAndamento = true;

    try {
        await atualizarJogo();

        // Atualiza as demais informações.
        await Promise.all([
            atualizarRespostas(),
            atualizarJogadores(),
            atualizarRanking()
        ]);

        aviso("");

    } catch (erro) {
        console.error("Erro de atualização:", erro);
        aviso("Falha de conexão. Tentando novamente...");

    } finally {
        consultaEmAndamento = false;
    }
}

// Executa uma consulta por vez, sem acumular requisições.
async function ciclo() {
    await atualizarTudo();
    setTimeout(ciclo, 1000);
}

// Inicia o painel.
controlarBotoes();
ciclo();

</script>
</body>
</html>
