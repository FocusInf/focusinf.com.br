<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>📖 Desafio Bíblico - Administrador</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#111827,#1e3a8a);
color:#111827;
min-height:100vh;
padding:20px
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 15px 40px #0006
}

h1{
text-align:center;
color:#1e3a8a
}

.painel{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}

.card{
background:#f3f4f6;
padding:20px;
border-radius:15px
}

button{
width:100%;
padding:15px;
margin:5px 0;
border:0;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#1e3a8a;
color:white
}

button.encerrar{
background:#b91c1c
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.pergunta{
font-size:24px;
font-weight:bold;
margin:20px 0
}

.pontos{
font-size:22px;
font-weight:bold;
color:#b45309
}

.timer{
font-size:45px;
font-weight:bold;
color:#dc2626;
text-align:center
}

.ranking p{
padding:10px;
margin:5px 0;
background:white;
border-radius:8px
}

.status{
font-size:18px;
font-weight:bold;
margin:10px 0
}

.respostas{
font-size:18px;
font-weight:bold;
text-align:center;
margin:10px 0;
color:#1e3a8a
}

@media(max-width:700px){

.painel{
grid-template-columns:1fr
}

}

</style>

</head>

<body>

<div class="container">

<h1>👨‍💼 Painel do Administrador</h1>

<div class="painel">

<div class="card">

<h2>🎮 Controle da partida</h2>

<button onclick="iniciar()">
▶️ Iniciar partida
</button>

<button onclick="proxima()">
➡️ Liberar próxima pergunta
</button>

<button onclick="encerrarPergunta()">
⏹️ Encerrar pergunta
</button>

<button class="encerrar" onclick="encerrar()">
🛑 Encerrar partida
</button>

<div id="status" class="status"></div>

</div>


<div class="card">

<h2>👥 Jogadores</h2>

<div id="jogadores">
Carregando...
</div>

</div>

</div>


<div class="card" style="margin-top:20px">

<h2>📖 Pergunta atual</h2>

<div class="pontos" id="pontos"></div>

<div class="timer" id="tempo">--</div>

<div class="respostas" id="respostas">
0 / 0 jogadores responderam
</div>

<div class="pergunta" id="texto">
Nenhuma pergunta liberada.
</div>

<div id="numero"></div>

</div>


<div class="card" style="margin-top:20px">

<h2>🏆 Ranking</h2>

<div class="ranking" id="ranking">
Carregando...
</div>

</div>

</div>


<script>

let timer = null;

let perguntaAtual = null;

let ultimaPerguntaId = null;


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciar(){

    try{

        const r = await fetch("/api/jogo",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                acao:"iniciar"
            })

        });

        const d = await r.json();

        if(!d.sucesso){

            alert(d.erro || "Erro ao iniciar.");

            return;
        }

        alert("Partida iniciada!");

        await atualizar();

    }catch(e){

        console.error(e);

        alert("Erro de conexão.");

    }

}


/* =====================================================
   PRÓXIMA PERGUNTA
===================================================== */

async function proxima(){

    try{

        const r = await fetch("/api/jogo",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                acao:"proxima"
            })

        });

        const d = await r.json();

        if(!d.sucesso){

            alert(d.erro || "Erro.");

            return;
        }

        if(d.finalizado){

            alert(
                "Não existem mais perguntas disponíveis."
            );

            await atualizar();

            return;
        }

        await atualizar();

    }catch(e){

        console.error(e);

        alert("Erro de conexão.");

    }

}


/* =====================================================
   ENCERRAR PERGUNTA
===================================================== */

async function encerrarPergunta(){

    try{

        const r = await fetch("/api/jogo",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                acao:"encerrar_pergunta"
            })

        });

        const d = await r.json();

        if(!d.sucesso){

            alert(
                d.erro ||
                "Não foi possível encerrar a pergunta."
            );

            return;
        }

        /*
         * Para imediatamente o cronômetro
         * do administrador.
         */

        clearInterval(timer);

        document.getElementById("tempo").innerText = "0";

        document.getElementById("status").innerText =
            "🟡 Pergunta encerrada — ranking liberado";

        await atualizar();

    }catch(e){

        console.error(e);

        alert("Erro de conexão.");

    }

}


/* =====================================================
   ENCERRAR PARTIDA
===================================================== */

async function encerrar(){

    if(
        !confirm(
            "Tem certeza que deseja encerrar a partida?\n\n" +
            "Isso irá apagar os jogadores, respostas e pontuações."
        )
    ){

        return;
    }


    try{

        const r = await fetch("/api/jogo",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                acao:"encerrar"
            })

        });

        const d = await r.json();

        if(!d.sucesso){

            alert(
                d.erro ||
                "Erro ao encerrar partida."
            );

            return;
        }

        clearInterval(timer);

        alert(
            "Partida encerrada e dados limpos."
        );

        await atualizar();

    }catch(e){

        console.error(e);

        alert("Erro de conexão.");

    }

}


/* =====================================================
   ATUALIZAR ESTADO DO JOGO
===================================================== */

async function atualizar(){

    try{

        const r = await fetch(
            "/api/jogo?_=" + Date.now()
        );

        const d = await r.json();

        if(!d.sucesso){

            return;
        }

        const j = d.jogo;


        /* =================================================
           STATUS
        ================================================= */

        document.getElementById("status").innerText =

            j.encerrado

            ?

            "🛑 Partida encerrada"

            :

            j.pergunta_ativa

            ?

            "🟢 Pergunta ativa"

            :

            j.iniciado

            ?

            "🟡 Aguardando próxima pergunta"

            :

            "⚪ Partida parada";



      /* =================================================
   PERGUNTA ATIVA
================================================= */

if(
    j.pergunta_ativa &&
    j.pergunta
){

    document.getElementById("texto").innerText =
        j.pergunta.pergunta;

    document.getElementById("pontos").innerText =
        "💰 " +
        j.pergunta.pontos +
        " pontos";

    document.getElementById("numero").innerText =
        "Pergunta nº " +
        j.numero_pergunta;

    perguntaAtual = j;

    ultimaPerguntaId =
        j.pergunta.id;

    if(!timer){

        iniciarTimer(j.tempo_inicio);

    }

}


        /* =================================================
           PERGUNTA ENCERRADA
        ================================================= */

        else{

            clearInterval(timer);

            document.getElementById("tempo").innerText =
                j.iniciado && Number(j.numero_pergunta || 0) > 0
                ?
                "ENCERRADA"
                :
                "--";

            document.getElementById("texto").innerText =
                "Nenhuma pergunta ativa.";

            document.getElementById("pontos").innerText = "";

            document.getElementById("numero").innerText = "";

            perguntaAtual = null;

        }


        /*
         * Atualiza contagem de respostas
         */

        await atualizarRespostas();

    }catch(e){

        console.error(e);

    }

}


/* =====================================================
   CRONÔMETRO
===================================================== */

function iniciarTimer(inicio){

    clearInterval(timer);

    if(!inicio){

        document.getElementById("tempo").innerText =
            "--";

        return;
    }


    const fim =
        new Date(inicio).getTime() +
        60000;


    function atualizarTimer(){

        /*
         * Se a pergunta já foi encerrada,
         * não continua contando.
         */

        if(
            perguntaAtual &&
            perguntaAtual.pergunta_ativa === false
        ){

            clearInterval(timer);

            document.getElementById("tempo").innerText =
                "ENCERRADA";

            return;
        }


        const restante =
            Math.max(
                0,
                Math.ceil(
                    (fim - Date.now()) / 1000
                )
            );


        document.getElementById("tempo").innerText =
            restante;


        if(restante <= 0){

            clearInterval(timer);

        }

    }


    atualizarTimer();


    timer =
        setInterval(
            atualizarTimer,
            250
        );

}
/* =====================================================
   CONTAR RESPOSTAS
===================================================== */
async function atualizarRespostas(){

    try{

        if(
            !perguntaAtual ||
            !perguntaAtual.pergunta
        ){

            return;
        }

        const r =
            await fetch(
                "/api/responder?pergunta_id=" +
                perguntaAtual.pergunta.id +
                "&_=" +
                Date.now()
            );

        if(!r.ok){

            return;
        }

        const d =
            await r.json();

        if(d.totalJogadores !== undefined){

            document.getElementById(
                "respostas"
            ).innerText =

                d.totalRespostas +
                " / " +
                d.totalJogadores +
                " jogadores responderam";


            if(
                d.totalJogadores > 0 &&
                d.totalRespostas >=
                d.totalJogadores
            ){

                clearInterval(timer);

                document.getElementById(
                    "tempo"
                ).innerText =
                    "ENCERRADA";

                document.getElementById(
                    "status"
                ).innerText =
                    "🟡 Todos responderam";

                return;
            }

        }

    }catch(e){

        console.error(e);

    }

}

/* =====================================================
   RANKING
===================================================== */

async function ranking(){

    try{

        const r =
            await fetch(
                "/api/ranking"
            );

        const d =
            await r.json();

        if(!d.sucesso){

            return;
        }


        document.getElementById(
            "ranking"
        ).innerHTML =

            d.ranking.length

            ?

            d.ranking
            .map((j,i)=>`

                <p>

                    <b>
                        ${i+1}º
                    </b>

                    ${j.nome}

                    —

                    <b>
                        ${j.pontuacao}
                        pontos
                    </b>

                </p>

            `)
            .join("")

            :

            "Nenhum jogador.";

    }catch(e){

        console.error(e);

    }

}


/* =====================================================
   CICLO
===================================================== */

async function ciclo(){

    await atualizar();

    await jogadores();

    await ranking();

}


/*
 * Atualiza a tela a cada 1 segundo.
 */

ciclo();

setInterval(
    ciclo,
    1000
);

</script>

</body>

</html>
