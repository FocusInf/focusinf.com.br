
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>📖 Desafio Bíblico - Administrador</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e3a8a);
    color: #111827;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 40px #0006;
}

h1 {
    text-align: center;
    color: #1e3a8a;
}

.painel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    padding: 20px;
    border-radius: 15px;
    background: #f3f4f6;
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 0;
    border-radius: 10px;
    background: #1e3a8a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

button.encerrar {
    background: #b91c1c;
}

.pergunta {
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
}

.pontos {
    font-size: 22px;
    font-weight: bold;
    color: #b45309;
}

.timer {
    font-size: 45px;
    font-weight: bold;
    color: #dc2626;
    text-align: center;
}

.status {
    font-size: 18px;
    font-weight: bold;
    margin: 15px 0;
}

.respostas {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    margin: 12px 0;
    color: #1e3a8a;
}

.ranking p {
    padding: 10px;
    margin: 5px 0;
    background: white;
    border-radius: 8px;
}

#aviso {
    color: #b91c1c;
    font-weight: bold;
}

/* ================================================
   NOVO - LISTA DE JOGADORES
   ================================================ */

/* Coloca nome, pontos e botão na mesma linha. */
.jogador-linha {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
    margin: 5px 0;
    background: white;
    border-radius: 8px;
}

/* Permite que o nome ocupe o espaço disponível. */
.jogador-info {
    flex: 1;
    min-width: 140px;
    overflow-wrap: anywhere;
}

/* Botão pequeno para remover somente um jogador. */
button.btn-remover {
    display: inline-block;
    width: auto;
    margin: 0;
    padding: 9px 12px;
    background: #b91c1c;
    color: white;
    font-size: 14px;
    border-radius: 8px;
}

button.btn-remover:hover:not(:disabled) {
    background: #991b1b;
}

@media (max-width: 700px) {
    .painel {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>👨‍💼 Painel do Administrador</h1>

<div class="painel">

    <div class="card">
        <h2>🎮 Controle da partida</h2>

        <button id="btnIniciar" onclick="iniciar()">
            ▶️ Iniciar partida
        </button>

        <button id="btnProxima" onclick="proxima()">
            ➡️ Liberar próxima pergunta
        </button>

        <button id="btnFinalizar" onclick="finalizar()">
            🏆 Finalizar e mostrar ranking
        </button>

        <button id="btnEncerrar" class="encerrar"
                onclick="encerrar()">
            🛑 Encerrar e limpar jogadores
        </button>

        <div id="status" class="status">
            Carregando...
        </div>

        <div id="aviso" role="status"></div>
    </div>

    <div class="card">
        <h2>👥 Jogadores</h2>

        <!--
            Cada jogador será exibido com seu nome,
            pontuação e botão Remover.
        -->
        <div id="jogadores">Carregando...</div>
    </div>

</div>

<div class="card" style="margin-top:20px">
    <h2>📖 Pergunta atual</h2>

    <div id="pontos" class="pontos"></div>
    <div id="tempo" class="timer">--</div>

    <div id="respostas" class="respostas">
        0 / 0 jogadores responderam
    </div>

    <div id="texto" class="pergunta">
        Nenhuma pergunta liberada.
    </div>

    <div id="numero"></div>
</div>

<div class="card" style="margin-top:20px">
    <h2>🏆 Ranking</h2>
    <div id="ranking" class="ranking">
        Carregando...
    </div>
</div>

</div>

<script>
// =====================================================
// DESAFIO BÍBLICO - PAINEL ADMINISTRATIVO
// =====================================================
// Controla a partida e permite remover individualmente
// os jogadores que desistirem.
// =====================================================

// Guarda o estado atual da partida.
let estadoAtual = null;

// Guarda a identificação da rodada.
let rodadaAtual = null;

// Controla o cronômetro local.
let intervaloTimer = null;
let fimLocal = 0;

// Impede comandos repetidos e consultas simultâneas.
let comandoEmAndamento = false;
let consultaEmAndamento = false;

// Guarda a pergunta para contar respostas.
let ultimaPerguntaId = null;

// Guarda a senha apenas na memória desta página.
// Não grava a senha no armazenamento do navegador.
let senhaAdmin = "";

// =====================================================
// FUNÇÕES AUXILIARES
// =====================================================

// Encontra um elemento pelo ID.
function elemento(id) {
    return document.getElementById(id);
}

// Mostra mensagens no painel.
function aviso(mensagem) {
    elemento("aviso").textContent = mensagem || "";
}

// Habilita ou desabilita os botões de controle.
function controlarBotoes() {
    const j = estadoAtual;

    elemento("btnIniciar").disabled = comandoEmAndamento;

    elemento("btnProxima").disabled =
        comandoEmAndamento ||
        !j ||
        !j.iniciado ||
        j.encerrado ||
        j.pergunta_ativa;

    elemento("btnFinalizar").disabled =
        comandoEmAndamento ||
        !j ||
        j.encerrado;

    elemento("btnEncerrar").disabled =
        comandoEmAndamento;

    // Bloqueia temporariamente os botões Remover
    // enquanto outro comando estiver sendo executado.
    document.querySelectorAll(".btn-remover")
        .forEach(botao => {
            botao.disabled = comandoEmAndamento;
        });
}

// =====================================================
// ENVIAR COMANDO AO SERVIDOR COM SENHA
// =====================================================

// O segundo parâmetro permite enviar informações extras,
// como o ID do jogador que será removido.
async function enviarComando(acao, parametros = {}) {

    // Impede dois comandos simultâneos.
    if (comandoEmAndamento) return null;

    // Solicita a senha na primeira operação.
    if (!senhaAdmin) {
        const digitada = prompt(
            "Digite a senha do administrador:"
        );

        // Não executa nada se cancelar.
        if (digitada === null || digitada === "") {
            return null;
        }

        senhaAdmin = digitada;
    }

    comandoEmAndamento = true;
    controlarBotoes();
    aviso("");

    try {

        const resposta = await fetch("/api/jogo", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",

                // Senha verificada pela API no servidor.
                "X-Admin-Password": senhaAdmin
            },
            cache: "no-store",

            // Envia a ação e seus parâmetros.
            body: JSON.stringify({
                acao,
                ...parametros
            })
        });

        const dados = await resposta.json();

        // Se a senha estiver incorreta, solicita
        // novamente na próxima tentativa.
        if (
            resposta.status === 401 ||
            resposta.status === 403
        ) {
            senhaAdmin = "";

            throw new Error(
                dados.erro ||
                "Senha incorreta. Tente novamente."
            );
        }

        if (!resposta.ok || !dados.sucesso) {
            throw new Error(
                dados.erro ||
                "Não foi possível executar o comando."
            );
        }

        // Atualiza as informações após o comando.
        await atualizarTudo();

        return dados;

    } catch (erro) {

        console.error("Erro no comando:", erro);

        aviso(
            erro.message || "Erro de conexão."
        );

        return null;

    } finally {

        comandoEmAndamento = false;
        controlarBotoes();
    }
}

// =====================================================
// INICIAR PARTIDA
// =====================================================

async function iniciar() {

    // Iniciar uma nova partida zera pontos e respostas.
    if (!confirm(
        "Iniciar uma nova partida?\n\n" +
        "As respostas e pontuações anteriores serão zeradas."
    )) {
        return;
    }

    const dados = await enviarComando("iniciar");

    if (dados) {
        ultimaPerguntaId = null;
        rodadaAtual = null;
        pararTimer();
        aviso("");
    }
}

// =====================================================
// LIBERAR PRÓXIMA PERGUNTA
// =====================================================

async function proxima() {

    const dados = await enviarComando("proxima");

    if (dados && dados.finalizado) {
        alert("Não há mais perguntas disponíveis.");
    }
}

// =====================================================
// FINALIZAR E MOSTRAR RANKING
// =====================================================

async function finalizar() {

    if (!confirm(
        "Finalizar a partida e mostrar o ranking final?"
    )) {
        return;
    }

    await enviarComando("encerrar_pergunta");
}

// =====================================================
// ENCERRAR E LIMPAR TODOS OS JOGADORES
// =====================================================

async function encerrar() {

    if (!confirm(
        "ATENÇÃO!\n\n" +
        "Encerrar e apagar jogadores, respostas e pontuações?"
    )) {
        return;
    }

    const dados = await enviarComando("encerrar");

    if (dados) {
        ultimaPerguntaId = null;
        rodadaAtual = null;
        pararTimer();
    }
}

// =====================================================
// NOVO - REMOVER UM JOGADOR ESPECÍFICO
// =====================================================

// Esta função é chamada pelo botão Remover.
// Recebe o ID e o nome do jogador selecionado.
async function removerJogador(jogadorId, nomeJogador) {

    // Evita remover enquanto outro comando está ativo.
    if (comandoEmAndamento) return;

    // Confirma qual jogador será removido.
    const confirmado = confirm(
        "REMOVER JOGADOR\n\n" +
        "Jogador: " + nomeJogador + "\n\n" +
        "O cadastro, as respostas e os pontos " +
        "deste jogador serão apagados.\n\n" +
        "Os demais jogadores continuarão normalmente.\n\n" +
        "Deseja continuar?"
    );

    // Cancelar mantém o jogador no jogo.
    if (!confirmado) return;

    // Envia o ID ao servidor, com a senha administrativa.
    const dados = await enviarComando(
        "remover_jogador",
        {
            jogador_id: jogadorId
        }
    );

    // Se o servidor confirmou, mostra a mensagem.
    if (dados) {

        // Atualiza jogadores, ranking e respostas.
        await atualizarTudo();

        alert(
            dados.mensagem ||
            "Jogador removido com sucesso."
        );
    }
}

// =====================================================
// CRONÔMETRO
// =====================================================

// Para o cronômetro da rodada anterior.
function pararTimer() {

    if (intervaloTimer !== null) {
        clearInterval(intervaloTimer);
        intervaloTimer = null;
    }
}

// Atualiza os segundos exibidos.
function desenharTempo() {

    if (!estadoAtual || !estadoAtual.pergunta_ativa) {
        pararTimer();
        return;
    }

    const restante = Math.max(
        0,
        Math.ceil(
            (fimLocal - Date.now()) / 1000
        )
    );

    elemento("tempo").textContent = String(restante);

    if (restante <= 0) {
        pararTimer();
        elemento("tempo").textContent = "ENCERRADA";
    }
}

// Inicia o cronômetro da pergunta atual.
function iniciarTimer(jogo) {

    pararTimer();

    // Usa o tempo restante informado pelo servidor.
    // Atualizar a página não reinicia os 60 segundos.
    const restante = Math.max(
        0,
        Number(jogo.tempo_restante || 0)
    );

    fimLocal = Date.now() + restante * 1000;

    desenharTempo();

    if (restante > 0) {
        intervaloTimer = setInterval(
            desenharTempo,
            250
        );
    }
}

// =====================================================
// ATUALIZAR ESTADO DA PARTIDA
// =====================================================

async function atualizarJogo() {

    const resposta = await fetch(
        "/api/jogo?_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) {
        throw new Error("Falha ao consultar o jogo.");
    }

    const dados = await resposta.json();

    if (!dados.sucesso || !dados.jogo) {
        throw new Error(
            dados.erro || "Estado indisponível."
        );
    }

    const j = dados.jogo;
    estadoAtual = j;

    // Atualiza o status da partida.
    elemento("status").textContent =
        j.encerrado
            ? "🏆 Partida finalizada"
            : j.pergunta_ativa
                ? "🟢 Pergunta ativa"
                : j.iniciado
                    ? "🟡 Aguardando próxima pergunta"
                    : "⚪ Partida parada";

    if (j.pergunta_id) {
        ultimaPerguntaId = j.pergunta_id;
    }

    if (j.pergunta_ativa && j.pergunta) {

        // Identifica a rodada.
        const chaveRodada = [
            j.pergunta.id,
            j.numero_pergunta,
            j.tempo_inicio
        ].join("|");

        elemento("texto").textContent =
            j.pergunta.pergunta;

        elemento("pontos").textContent =
            "💰 " + j.pergunta.pontos + " pontos";

        elemento("numero").textContent =
            "Pergunta nº " + j.numero_pergunta;

        // Só reinicia o cronômetro se a rodada mudou.
        if (
            chaveRodada !== rodadaAtual ||
            intervaloTimer === null
        ) {
            rodadaAtual = chaveRodada;
            iniciarTimer(j);
        }

    } else {

        // A pergunta terminou ou não foi liberada.
        pararTimer();
        rodadaAtual = null;

        elemento("tempo").textContent =
            Number(j.numero_pergunta || 0) > 0
                ? "ENCERRADA"
                : "--";

        elemento("texto").textContent =
            "Nenhuma pergunta ativa.";

        elemento("pontos").textContent = "";
        elemento("numero").textContent = "";
    }

    controlarBotoes();
}

// =====================================================
// CONTAR RESPOSTAS
// =====================================================

async function atualizarRespostas() {

    if (!ultimaPerguntaId) {
        elemento("respostas").textContent =
            "0 / 0 jogadores responderam";
        return;
    }

    const resposta = await fetch(
        "/api/responder?pergunta_id=" +
        encodeURIComponent(ultimaPerguntaId) +
        "&_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) return;

    const dados = await resposta.json();

    if (!dados.sucesso) return;

    elemento("respostas").textContent =
        dados.totalRespostas +
        " / " +
        dados.totalJogadores +
        " jogadores responderam";
}

// =====================================================
// LISTAR JOGADORES COM BOTÃO REMOVER
// =====================================================

async function atualizarJogadores() {

    const resposta = await fetch(
        "/api/jogadores?_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) return;

    const dados = await resposta.json();

    if (!dados.sucesso) return;

    const destino = elemento("jogadores");

    // Limpa a lista antes de desenhar a versão atual.
    destino.replaceChildren();

    if (!dados.jogadores?.length) {
        destino.textContent = "Nenhum jogador.";
        return;
    }

    // Cria uma linha para cada jogador.
    for (const jogador of dados.jogadores) {

        // Linha contendo informações e botão.
        const linha = document.createElement("div");
        linha.className = "jogador-linha";

        // Exibe nome e pontuação.
        const informacoes = document.createElement("span");
        informacoes.className = "jogador-info";

        // textContent impede executar HTML enviado
        // como nome de jogador.
        informacoes.textContent =
            "👤 " + jogador.nome +
            " — 💰 " + jogador.pontuacao + " pontos";

        // Cria o botão individual de remoção.
        const botao = document.createElement("button");

        botao.type = "button";
        botao.className = "btn-remover";
        botao.textContent = "🗑️ Remover";

        // Desabilita durante operações administrativas.
        botao.disabled = comandoEmAndamento;

        // Identifica o jogador pelo ID, nunca
        // apenas pelo nome.
        botao.onclick = () => {
            removerJogador(
                jogador.id,
                jogador.nome
            );
        };

        // Coloca os elementos na linha.
        linha.appendChild(informacoes);
        linha.appendChild(botao);

        // Adiciona a linha ao painel.
        destino.appendChild(linha);
    }
}

// =====================================================
// ATUALIZAR RANKING
// =====================================================

async function atualizarRanking() {

    const resposta = await fetch(
        "/api/ranking?_=" + Date.now(),
        { cache: "no-store" }
    );

    if (!resposta.ok) return;

    const dados = await resposta.json();

    if (!dados.sucesso) return;

    const destino = elemento("ranking");
    destino.replaceChildren();

    if (!dados.ranking?.length) {
        destino.textContent = "Nenhum jogador.";
        return;
    }

    dados.ranking.forEach((jogador, indice) => {

        const linha = document.createElement("p");

        linha.textContent =
            (indice + 1) + "º " +
            jogador.nome +
            " — " +
            jogador.pontuacao + " pontos";

        destino.appendChild(linha);
    });
}

// =====================================================
// ATUALIZAÇÃO AUTOMÁTICA
// =====================================================

async function atualizarTudo() {

    // Evita consultas simultâneas.
    if (consultaEmAndamento) return;

    consultaEmAndamento = true;

    try {

        await atualizarJogo();

        // Atualiza as demais informações.
        await Promise.all([
            atualizarRespostas(),
            atualizarJogadores(),
            atualizarRanking()
        ]);

        aviso("");

    } catch (erro) {

        console.error(
            "Erro de atualização:",
            erro
        );

        aviso(
            "Falha de conexão. Tentando novamente..."
        );

    } finally {

        consultaEmAndamento = false;
    }
}

// Consulta periodicamente o estado do jogo.
async function ciclo() {

    await atualizarTudo();

    setTimeout(ciclo, 1000);
}

// Inicia o painel administrativo.
controlarBotoes();
ciclo();

</script>
</body>
</html>
